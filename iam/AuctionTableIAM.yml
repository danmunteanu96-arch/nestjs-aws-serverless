AuctionsApiRole:
  Type: AWS::IAM::Role
  Properties:
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
    Policies:
      - PolicyName: auctions-table-write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - AuctionsTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - AuctionsTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::GetAtt:
                  - AuctionsTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - Fn::Join:
                    - ''
                    - - Fn::GetAtt:
                          - AuctionsTable
                          - Arn
                      - '/index/status-endDate-index'
    Tags:
      - Key: Project
        Value: nestjs-aws-serverless
      - Key: Environment
        Value: ${sls:stage}
      - Key: Owner
        Value: ${env:RESOURCE_OWNER, 'course-team'}
AuctionsExpirationRole:
  Type: AWS::IAM::Role
  Properties:
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
    Policies:
      - PolicyName: close-expired-auctions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - AuctionsTable
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                Fn::Join:
                  - ''
                  - - Fn::GetAtt:
                        - AuctionsTable
                        - Arn
                    - '/index/status-endDate-v2-index'
            # The expiration Lambda no longer sends email itself — it hands the
            # job to SQS. Producer needs exactly one permission: enqueue.
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                Fn::GetAtt:
                  - WinnerNotificationsQueue
                  - Arn
    Tags:
      - Key: Project
        Value: nestjs-aws-serverless
      - Key: Environment
        Value: ${sls:stage}
      - Key: Owner
        Value: ${env:RESOURCE_OWNER, 'course-team'}
# Role for the SQS-triggered consumer Lambda: it may drain the notification
# queue and send the winner email, nothing else.
WinnerNotificationRole:
  Type: AWS::IAM::Role
  Properties:
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
    Policies:
      - PolicyName: consume-winner-notifications
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            # These three are the minimum an SQS event-source mapping needs:
            # poll the queue, delete processed messages, read queue config.
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                Fn::GetAtt:
                  - WinnerNotificationsQueue
                  - Arn
            # Production-style least privilege: recipients are unknown ahead of
            # time (any user's email), so Resource is '*' and the restriction
            # moves to the controllable part — WHO is allowed to send.
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  ses:FromAddress: ${env:SES_SENDER_EMAIL, 'unconfigured@example.com'}
    Tags:
      - Key: Project
        Value: nestjs-aws-serverless
      - Key: Environment
        Value: ${sls:stage}
      - Key: Owner
        Value: ${env:RESOURCE_OWNER, 'course-team'}
