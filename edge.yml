# =============================================================================
# edge.yml — public HTTPS entry point (CloudFront).
#
# Stack name: nestjs-aws-serverless-edge-<stage>
# Deploy order: 3) AFTER infra.yml and api.yml, because it reads the API id.
# Region: us-east-1 is mandatory for CloudFront, ACM certificates for CloudFront,
#         and WAF WebACLs with Scope: CLOUDFRONT.
#
# What it creates in the cost-safe profile:
#   - one CloudFront distribution using the free *.cloudfront.net certificate
#   - an origin pointing at the API Gateway id from SSM /api/id
#   - an origin custom header with the edge shared secret
#
# What it does NOT create by default:
#   - WAF WebACL/association (WAF_ENABLED=false)
#   - ACM certificate, Route 53 record or custom domain (PROD_CUSTOM_DOMAIN_ENABLED=false)
#
# Cost notes:
#   - CloudFront has a monthly free tier; PriceClass_100 keeps traffic in the
#     cheapest edge locations.
#   - No fixed monthly fee is added by the default profile.
#
# Related files:
#   resources/EdgeResource.yml   distribution and optional paid resources
#   api.yml                      writes /nestjs-aws-serverless/<stage>/api/id
#   configure-secrets.sh         writes the edge secret in both regions
# =============================================================================
service: nestjs-aws-serverless-edge

# -----------------------------------------------------------------------------
# provider — CloudFront is global, but its control plane and certificates are
# created in us-east-1.
# -----------------------------------------------------------------------------
provider:
  name: aws
  runtime: nodejs24.x
  # CloudFront WAF and ACM certificates must live in us-east-1.
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  stackTags:
    Project: nestjs-aws-serverless
    Environment: ${sls:stage}
    Owner: ${env:RESOURCE_OWNER, 'course-team'}

# -----------------------------------------------------------------------------
# params — stage defaults for optional paid features.
# -----------------------------------------------------------------------------
params:
  default:
    customDomain: false
  prod:
    # Keep the free CloudFront certificate; no ACM/Route 53 purchase.
    customDomain: false

# -----------------------------------------------------------------------------
# custom — resolved switches used by Conditions below.
# -----------------------------------------------------------------------------
custom:
  project: nestjs-aws-serverless
  # Custom domain requires an ACM certificate and a Route 53 hosted zone.
  customDomain: ${strToBool(${env:PROD_CUSTOM_DOMAIN_ENABLED, '${param:customDomain}'})}
  domainName: ${env:PROD_API_DOMAIN, 'api.auctions.example.com'}
  hostedZoneId: ${env:PROD_HOSTED_ZONE_ID, 'Z00000000000000000000'}
  # WAF is opt-in because WebACLs and rules incur hourly prorated charges.
  wafEnabled: ${strToBool(${env:WAF_ENABLED, 'false'})}
  wafRateLimit: ${env:WAF_RATE_LIMIT, '2000'}

# -----------------------------------------------------------------------------
# resources — CloudFormation conditions and resource includes.
# -----------------------------------------------------------------------------
resources:
  Conditions:
    # true only when PROD_CUSTOM_DOMAIN_ENABLED=true.
    UseCustomDomain: !Equals ['${self:custom.customDomain}', true]
    # true only when WAF_ENABLED=true.
    UseWaf: !Equals ['${self:custom.wafEnabled}', true]
  Resources:
    # CloudFront distribution is always created.
    EdgeDistribution: ${file(./resources/EdgeResource.yml):EdgeDistribution}
    # Lambda@Edge adds the origin shared-secret header at request time.
    EdgeOriginHeaderRole: ${file(./resources/EdgeResource.yml):EdgeOriginHeaderRole}
    EdgeOriginHeaderFunction: ${file(./resources/EdgeResource.yml):EdgeOriginHeaderFunction}
    EdgeOriginHeaderVersion: ${file(./resources/EdgeResource.yml):EdgeOriginHeaderVersion}
    # The next three resources are created only when Condition: UseWaf is true.
    EdgeWebAcl: ${file(./resources/EdgeResource.yml):EdgeWebAcl}
    EdgeWebAclAssociation: ${file(./resources/EdgeResource.yml):EdgeWebAclAssociation}
    # The next two resources are created only when Condition: UseCustomDomain is true.
    EdgeCertificate: ${file(./resources/EdgeResource.yml):EdgeCertificate}
    EdgeDnsRecord: ${file(./resources/EdgeResource.yml):EdgeDnsRecord}
  # Outputs are printed after deploy; DistributionDomainName is the public URL host.
  Outputs:
    DistributionDomainName:
      Value: !GetAtt EdgeDistribution.DomainName
    DistributionId:
      Value: !Ref EdgeDistribution
