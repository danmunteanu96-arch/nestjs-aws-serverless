service: nestjs-aws-serverless

plugins:
  - serverless-esbuild
  - serverless-offline

build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-central-1
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  stage: ${opt:stage, 'dev'}
  tags:
    Project: ${self:service}
    Environment: ${sls:stage}
    Owner: ${env:RESOURCE_OWNER, 'course-team'}
  stackTags:
    Project: ${self:service}
    Environment: ${sls:stage}
    Owner: ${env:RESOURCE_OWNER, 'course-team'}
  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Join:
            - ''
            - - 'https://cognito-idp.'
              - Ref: AWS::Region
              - '.amazonaws.com/'
              - Ref: CognitoUserPool
        audience:
          - Ref: CognitoUserPoolClient
  environment:
    NODE_ENV: production
    CORS_ORIGINS: ${env:CORS_ORIGINS, ''}
    API_DOCS_ENABLED: ${env:API_DOCS_ENABLED, 'false'}
    AUCTIONS_TABLE:
      Ref: AuctionsTable

custom:
  esbuild:
    bundle: true
    minify: true
    keepNames: true
    sourcemap: false
    plugins: plugins.js
    external:
      - '@fastify/static'
    exclude:
      - '@nestjs/microservices'
      - '@nestjs/websockets'
      - 'cache-manager'
    target: node24
    platform: node
    concurrency: 10

functions:
  api:
    handler: src/lambda.handler
    role:
      Fn::GetAtt:
        - AuctionsApiRole
        - Arn
    events:
      - httpApi:
          path: '/'
          method: GET
      - httpApi:
          path: '/{proxy+}'
          method: GET
      - httpApi:
          path: '/{proxy+}'
          method: POST
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: '/{proxy+}'
          method: PATCH
          authorizer:
            name: cognitoAuthorizer
  closeExpiredAuctions:
    handler: src/auction-expiration.handler
    role:
      Fn::GetAtt:
        - AuctionsExpirationRole
        - Arn
    timeout: 60
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true

resources:
  Resources:
    AuctionsTable: ${file(./resources/AuctionTableResource.yml):AuctionsTable}
    AuctionsApiRole: ${file(./iam/AuctionTableIAM.yml):AuctionsApiRole}
    AuctionsExpirationRole: ${file(./iam/AuctionTableIAM.yml):AuctionsExpirationRole}
    CognitoUserPool: ${file(./resources/CognitoAuthResource.yml):CognitoUserPool}
    CognitoUserPoolDomain: ${file(./resources/CognitoAuthResource.yml):CognitoUserPoolDomain}
    CognitoUserPoolClient: ${file(./resources/CognitoAuthResource.yml):CognitoUserPoolClient}
  Outputs:
    CognitoUserPoolId:
      Value:
        Ref: CognitoUserPool
    CognitoUserPoolClientId:
      Value:
        Ref: CognitoUserPoolClient
    CognitoHostedUIUrl:
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - Ref: CognitoUserPoolDomain
            - '.auth.'
            - Ref: AWS::Region
            - '.amazoncognito.com'
