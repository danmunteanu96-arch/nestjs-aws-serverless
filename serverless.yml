service: nestjs-aws-serverless

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-central-1
  memorySize: 256
  timeout: 10
  stage: ${opt:stage, 'dev'}
  environment:
    AUCTIONS_TABLE:
      Ref: AuctionsTable

custom:
  esbuild:
    bundle: true
    minify: true
    keepNames: true
    sourcemap: false
    plugins: plugins.js
    exclude:
      - '@nestjs/microservices'
      - '@nestjs/websockets'
      - 'cache-manager'
      - 'class-transformer'
      - 'class-validator'
    target: node24
    platform: node
    concurrency: 10
  

functions:
  api:
    handler: src/lambda.handler
    role:
      Fn::GetAtt:
        - AuctionsApiRole
        - Arn
    events:
      - httpApi:
          path: '/'
          method: '*'
      - httpApi:
          path: '/{proxy+}'
          method: '*'
  closeExpiredAuctions:
    handler: src/auction-expiration.handler
    role:
      Fn::GetAtt:
        - AuctionsApiRole
        - Arn
    timeout: 60
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true

resources:
  Resources:
    AuctionsTable: ${file(./resources/AuctionTableResource.yml):AuctionsTable}
    AuctionsApiRole: ${file(./iam/AuctionTableIAM.yml):AuctionsApiRole}
