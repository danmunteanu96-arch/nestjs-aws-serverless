service: nestjs-aws-serverless

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-central-1 
  memorySize: 256
  timeout: 10
  stage: ${opt:stage, 'dev'}

custom:
  esbuild:
    bundle: true
    minify: true
    keepNames: true
    sourcemap: false
    plugins: plugins.js
    exclude:
      - '@nestjs/microservices'
      - '@nestjs/websockets'
      - 'cache-manager'
      - 'class-transformer'
      - 'class-validator'
    target: node20 
    platform: node
    concurrency: 10

functions:
  api:
    handler: src/lambda.handler
    events:
      - httpApi:
          path: '/'
          method: '*'