# =============================================================================
# resources/CognitoAuthResource.yml
#
# Included by: infra.yml (3 resources)
# AWS service: Cognito User Pools.
#
# Flow:
#   1. A user signs in and receives an IdToken from Cognito.
#   2. Postman sends Authorization: Bearer <IdToken>.
#   3. API Gateway's Cognito authorizer validates the token before Lambda runs.
#   4. The Lambda reads claims (sub, email) from the API Gateway event.
#
# Cost notes: Cognito has a free tier for small user pools; TOTP MFA avoids
# SMS charges. No client secret is generated because this is a public SPA/client.
# Retain: deleting the stack does NOT delete the user pool or its users.
# =============================================================================

# The user directory. Email is the username and is auto-verified.
CognitoUserPool:
  Type: AWS::Cognito::UserPool
  DeletionPolicy: Retain
  UpdateReplacePolicy: Retain
  Properties:
    UserPoolName: ${self:custom.project}-users-${sls:stage}
    UsernameAttributes:
      - email
    AutoVerifiedAttributes:
      - email
    # Strong passwords for the course; adjust for a real product policy.
    Policies:
      PasswordPolicy:
        MinimumLength: 12
        RequireLowercase: true
        RequireUppercase: true
        RequireNumbers: true
        RequireSymbols: true
        TemporaryPasswordValidityDays: 7
    # CloudFormation enables TOTP here, avoiding SMS charges and an SNS delivery role.
    MfaConfiguration: 'OPTIONAL'
    EnabledMfas:
      - SOFTWARE_TOKEN_MFA
    # Password recovery goes through the verified email, not SMS.
    AccountRecoverySetting:
      RecoveryMechanisms:
        - Name: verified_email
          Priority: 1

# A Cognito-hosted domain used by the OAuth authorization-code flow.
CognitoUserPoolDomain:
  Type: AWS::Cognito::UserPoolDomain
  Properties:
    Domain: serverless-auctions-${sls:stage}-${aws:accountId}
    UserPoolId:
      Ref: CognitoUserPool

# This is a public authorization-code client, so no client secret exists by design.
CognitoUserPoolClient:
  Type: AWS::Cognito::UserPoolClient
  Properties:
    ClientName: ${self:custom.project}-client-${sls:stage}
    UserPoolId:
      Ref: CognitoUserPool
    # Public clients must not embed a secret in browser/mobile code.
    GenerateSecret: false
    AllowedOAuthFlowsUserPoolClient: true
    AllowedOAuthFlows:
      - code
    AllowedOAuthScopes:
      - openid
      - email
      - profile
    # Local frontend origin; set COGNITO_CALLBACK_URL for a real frontend.
    CallbackURLs:
      - ${env:COGNITO_CALLBACK_URL, 'https://app.auctions.example.com/callback'}
    LogoutURLs:
      - ${env:COGNITO_LOGOUT_URL, 'https://app.auctions.example.com/'}
    SupportedIdentityProviders:
      - COGNITO
    # USER_PASSWORD_AUTH is what scripts/create-cognito-test-user.sh uses.
    ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
    # Short access/ID tokens, longer refresh token (units declared below).
    AccessTokenValidity: 1
    IdTokenValidity: 1
    RefreshTokenValidity: 30
    TokenValidityUnits:
      AccessToken: hours
      IdToken: hours
      RefreshToken: days
    # Do not reveal whether an email exists during sign-in.
    PreventUserExistenceErrors: ENABLED
