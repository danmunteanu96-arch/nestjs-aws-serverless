AuctionsTable:
  Type: AWS::DynamoDB::Table
  DeletionPolicy: Retain
  UpdateReplacePolicy: Retain
  Properties:
    # Nume dinamic bazat pe serviciu și stage (ex: nestjs-aws-serverless-auctions-dev)
    TableName: ${self:service}-auctions-${sls:stage}
    BillingMode: PAY_PER_REQUEST
    PointInTimeRecoverySpecification:
      PointInTimeRecoveryEnabled: ${strToBool(${env:DYNAMODB_PITR_ENABLED, 'false'})}
    Tags:
      - Key: Project
        Value: ${self:service}
      - Key: Environment
        Value: ${sls:stage}
      - Key: Owner
        Value: ${env:RESOURCE_OWNER, 'course-team'}
    AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      - AttributeName: entityType
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      - AttributeName: endDate
        AttributeType: S
    KeySchema:
      - AttributeName: id
        KeyType: HASH
    GlobalSecondaryIndexes:
      - IndexName: status-createdAt-index
        KeySchema:
          - AttributeName: status
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
      - IndexName: all-auctions-index
        KeySchema:
          - AttributeName: entityType
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - status
      - IndexName: auctions-with-bids-index
        KeySchema:
          - AttributeName: entityType
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - status
            - currentBid
            - highestBidderId
      - IndexName: status-endDate-index
        KeySchema:
          - AttributeName: status
            KeyType: HASH
          - AttributeName: endDate
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - createdAt
            - currentBid
            - highestBidderId
