# =============================================================================
# resources/AuctionTableResource.yml
#
# Included by: infra.yml (resource AuctionsTable)
# AWS service: DynamoDB, one table used for auctions and their bids.
#
# Design: single-table with partition key `id`. Bids are separate items whose
# id is derived from the auction id, so they share the same partition when read.
# The GSIs answer the list/filter/expiration queries without scanning the table.
#
# Cost notes:
#   - PAY_PER_REQUEST: no provisioned capacity, no idle RCU/WCU bill.
#   - TTL deletes closed auctions 90 days after they close.
#   - PITR is controlled by the stack-level cost switch (off by default).
#   - Retain: deleting the stack does NOT delete the table.
# =============================================================================
AuctionsTable:
  Type: AWS::DynamoDB::Table
  # Keep auction data if the stack is deleted or the resource is replaced.
  DeletionPolicy: Retain
  UpdateReplacePolicy: Retain
  Properties:
    # The stable project prefix keeps names independent from the split stack name.
    TableName: ${self:custom.project}-auctions-${sls:stage}
    # On-demand billing: pay per request, ideal for a learning workload.
    BillingMode: PAY_PER_REQUEST
    # PITR is a billable backup feature and is false unless explicitly enabled.
    PointInTimeRecoverySpecification:
      PointInTimeRecoveryEnabled: ${strToBool(${self:custom.pitrEnabled})}
    # DynamoDB deletes expired closed auctions asynchronously; TTL is not a precise timer.
    TimeToLiveSpecification:
      AttributeName: expiresAt
      Enabled: true
    Tags:
      - Key: Project
        Value: ${self:custom.project}
      - Key: Environment
        Value: ${sls:stage}
      - Key: Owner
        Value: ${env:RESOURCE_OWNER, 'course-team'}
    # Every attribute used in a key or GSI key schema must be declared here.
    AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      - AttributeName: entityType
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: notificationStatus
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      - AttributeName: endDate
        AttributeType: S
    # Primary key: one auction per id. Bids use ids prefixed with the auction id.
    KeySchema:
      - AttributeName: id
        KeyType: HASH
    # GSIs are separate indexes maintained by DynamoDB; each supports one access pattern.
    GlobalSecondaryIndexes:
      # List auctions by status, newest first.
      - IndexName: status-createdAt-index
        KeySchema:
          - AttributeName: status
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
      # List all auctions (including bids) newest first.
      - IndexName: all-auctions-index
        KeySchema:
          - AttributeName: entityType
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - status
      # List auctions that have at least one bid.
      - IndexName: auctions-with-bids-index
        KeySchema:
          - AttributeName: entityType
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - status
            - currentBid
            - highestBidderId
      # Expiration job: find ACTIVE auctions whose endDate has passed.
      - IndexName: status-endDate-v2-index
        KeySchema:
          - AttributeName: status
            KeyType: HASH
          - AttributeName: endDate
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - createdAt
            - currentBid
            - highestBidderId
            - highestBidderEmail
      # Only pending notifications appear here, making scheduled retries inexpensive.
      - IndexName: notificationStatus-createdAt-index
        KeySchema:
          - AttributeName: notificationStatus
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
            - title
            - currentBid
            - highestBidderEmail
            - endDate
